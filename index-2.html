<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f6">
  <title>Will You Choose Me? 💗</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&family=Pacifico&display=swap');

    * { box-sizing: border-box; }

    :root {
      --pink: #ff5f9e;
      --deep-pink: #ed3d82;
      --soft: #fff0f6;
      --text: #7d3654;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Noto Sans Myanmar", sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.95) 0 4%, transparent 5%),
        radial-gradient(circle at 85% 20%, rgba(255,190,216,.45), transparent 28%),
        linear-gradient(135deg, #fff7fb 0%, #ffe9f2 48%, #ffd7e7 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 10% 85%, rgba(255,255,255,.9), transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,.75), transparent 22%);
    }

    .petal-bg {
      position: fixed;
      width: 18px;
      height: 18px;
      border-radius: 60% 40% 60% 40%;
      background: rgba(255, 119, 171, .22);
      transform: rotate(35deg);
      animation: drift 7s linear infinite;
      pointer-events: none;
    }

    @keyframes drift {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      15% { opacity: .8; }
      100% { transform: translateY(-15vh) rotate(360deg); opacity: 0; }
    }

    .card {
      width: min(92vw, 460px);
      min-height: 650px;
      padding: 34px 24px 28px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 32px;
      background: rgba(255,255,255,.56);
      box-shadow: 0 25px 70px rgba(180, 67, 112, .18), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .top-sticker {
      font-size: 76px;
      line-height: 1;
      min-height: 92px;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 10px 12px rgba(230, 70, 120, .14));
      animation: stickerFloat 2.8s ease-in-out infinite;
    }

    @keyframes stickerFloat {
      0%,100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .question {
      margin: 22px auto 12px;
      font-size: clamp(25px, 7vw, 36px);
      font-weight: 700;
      line-height: 1.65;
      color: #8b3157;
      text-shadow: 0 3px 12px rgba(255,255,255,.9);
    }

    .sub {
      margin: 0 auto 26px;
      font-size: 15px;
      opacity: .72;
    }

    .message {
      min-height: 58px;
      margin: 4px 0 12px;
      font-size: 20px;
      font-weight: 600;
      color: #b3406c;
      transition: opacity .22s ease, transform .22s ease, filter .22s ease;
    }

    .message.fade {
      opacity: 0;
      transform: translateY(6px);
      filter: blur(3px);
    }

    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: stretch;
      margin-top: 8px;
      position: relative;
      min-height: 82px;
    }

    button {
      border: 0;
      border-radius: 22px;
      padding: 16px 18px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all .35s cubic-bezier(.2,.8,.2,1);
      -webkit-tap-highlight-color: transparent;
    }

    #yesBtn {
      flex: 1.15;
      background: linear-gradient(135deg, #ff77ac, #ef3e82);
      color: white;
      box-shadow: 0 13px 28px rgba(239,62,130,.27);
      transform-origin: center;
    }

    #noBtn {
      flex: 1;
      background: rgba(255,255,255,.78);
      color: #a84a6e;
      border: 1px solid rgba(218, 91, 135, .15);
      box-shadow: 0 8px 20px rgba(150, 60, 100, .08);
    }

    button:active { transform: scale(.96); }

    .tiny {
      margin-top: 26px;
      font-size: 12px;
      opacity: .48;
    }

    /* Final screen */
    .final {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      padding: 30px 22px;
      align-items: center;
      justify-content: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,.85), transparent 32%),
        linear-gradient(160deg, #fff6fb, #ffe1ed 55%, #ffc9df);
      overflow: hidden;
    }

    .final.show { display: flex; animation: finalIn .9s ease both; }

    @keyframes finalIn {
      from { opacity: 0; transform: scale(1.04); }
      to { opacity: 1; transform: scale(1); }
    }

    .final-content {
      width: min(92vw, 600px);
      position: relative;
      z-index: 5;
    }

    .love-sticker {
      font-size: 82px;
      animation: heartPop .9s cubic-bezier(.2,1.4,.4,1) both, stickerFloat 3s ease-in-out 1s infinite;
    }

    @keyframes heartPop {
      from { transform: scale(.1); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .love-title {
      margin: 14px 0 10px;
      font-family: Pacifico, cursive;
      font-size: clamp(42px, 12vw, 72px);
      line-height: 1.15;
      color: #ed3e82;
      text-shadow: 0 8px 25px rgba(237,62,130,.2);
    }

    .final-text {
      font-size: clamp(17px, 4.6vw, 23px);
      line-height: 2;
      color: #7e3553;
      font-weight: 600;
    }

    .final-text .highlight {
      color: #ef3e82;
      font-size: 1.1em;
    }

    .restart {
      margin-top: 22px;
      background: rgba(255,255,255,.75);
      color: #b33e69;
      border: 1px solid rgba(210,70,120,.15);
      padding: 11px 20px;
      font-size: 13px;
    }

    /* Rising roses */
    .rose {
      position: fixed;
      bottom: -90px;
      font-size: 34px;
      z-index: 2;
      pointer-events: none;
      animation: rise linear forwards;
      filter: drop-shadow(0 8px 8px rgba(170, 50, 100, .18));
    }

    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg) scale(.65);
        opacity: 0;
      }
      12% { opacity: 1; }
      100% {
        transform: translateY(-115vh) translateX(var(--drift)) rotate(360deg) scale(1.25);
        opacity: 0;
      }
    }

    .sparkle {
      position: fixed;
      z-index: 3;
      pointer-events: none;
      font-size: 18px;
      animation: sparkle 1.4s ease-out forwards;
    }

    @keyframes sparkle {
      0% { transform: scale(.2); opacity: 0; }
      25% { opacity: 1; }
      100% { transform: translateY(-75px) scale(1.3); opacity: 0; }
    }

    @media (max-height: 760px) {
      .card { min-height: 590px; padding-top: 24px; }
      .top-sticker { font-size: 62px; min-height: 72px; }
      .question { margin-top: 14px; }
    }
  </style>
</head>

<body>
  <div class="petal-bg" style="left:7%;animation-delay:-1s"></div>
  <div class="petal-bg" style="left:25%;animation-delay:-4s"></div>
  <div class="petal-bg" style="left:53%;animation-delay:-2s"></div>
  <div class="petal-bg" style="left:78%;animation-delay:-5s"></div>
  <div class="petal-bg" style="left:91%;animation-delay:-3s"></div>

  <main class="card" id="card">
    <div class="top-sticker" id="sticker">🥺💗</div>

    <div class="question">ငါ့ရည်းစားဖြစ်ပေးနိုင်မလား?<br>ပြန်ချစ်ပေးနိုင်မလား? 🥺</div>

    <p class="sub">အဖြေကို သေချာလေးရွေးပေးနော်… 💕</p>

    <div class="message" id="message">မင်းရဲ့အဖြေကို စောင့်နေတယ်နော် 🥺</div>

    <div class="buttons">
      <button id="yesBtn">သေချာတာပေါ့ရှင့်... 💕</button>
      <button id="noBtn">မသေချာသေးဘူးရှင့်..</button>
    </div>

    <div class="tiny">တစ်ခုကိုပဲ ရွေးရမယ်နော် 🤭</div>
  </main>

  <section class="final" id="final">
    <div class="final-content">
      <div class="love-sticker">🥰💗🌹</div>
      <div class="love-title">Love You So Much</div>
      <div class="final-text">
        ပျော်လိုက်တာဗျာ… 🥹💕<br>
        ကိုယ့်ဘဝမှာ <span class="highlight">မင်းလေးကို</span> ရွေးချယ်ခဲ့တာ<br>
        နောက်ဆုံးတော့ ရပြီကွ… 🤭💗
      </div>
      <button class="restart" id="restart">အစကနေ ပြန်ကြည့်မယ် ↻</button>
    </div>
  </section>

  <script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const message = document.getElementById("message");
    const sticker = document.getElementById("sticker");
    const card = document.getElementById("card");
    const final = document.getElementById("final");
    const restart = document.getElementById("restart");

    let noCount = 0;

    const stages = [
      ["စဉ်းစားပါနော်… 🥺", "🥺💔"],
      ["သေချာပြန်စဉ်းစားပါဦးးး 🥺", "😢💔"],
      ["တကယ်ပြန်မချစ်နိုင်တော့ဘူးလား… 🥺", "😭💔"],
      ["နောက်တစ်ခါလောက် စဉ်းစားပေးပါနော်… 🥹", "🥹💔"],
      ["ဟင်… တကယ်ပဲ မရဘူးလား 🥺💔", "😭🌧️"]
    ];

    function animateMessage(text) {
      message.classList.add("fade");
      setTimeout(() => {
        message.textContent = text;
        message.classList.remove("fade");
      }, 180);
    }

    function sparkleAt(el) {
      const r = el.getBoundingClientRect();
      for (let i = 0; i < 5; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        s.textContent = i % 2 ? "✨" : "💕";
        s.style.left = (r.left + r.width / 2 + (Math.random() * 100 - 50)) + "px";
        s.style.top = (r.top + r.height / 2) + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1500);
      }
    }

    noBtn.addEventListener("click", () => {
      noCount++;

      const stage = stages[Math.min(noCount - 1, stages.length - 1)];
      sticker.textContent = stage[1];
      animateMessage(stage[0]);

      // The "sure" button gets bigger every time.
      const scale = Math.min(1 + noCount * 0.17, 2.05);
      yesBtn.style.transform = `scale(${scale})`;
      yesBtn.style.zIndex = 5;

      // Keep the second button from taking over the screen.
      const noScale = Math.max(1 - noCount * 0.05, .72);
      noBtn.style.transform = `scale(${noScale})`;

      // After a few taps, make the choice even more obvious.
      if (noCount >= 4) {
        yesBtn.textContent = "သေချာတာပေါ့ရှင့်... 💕";
      }

      sparkleAt(noBtn);
    });

    yesBtn.addEventListener("click", () => {
      final.classList.add("show");
      card.style.opacity = "0";
      card.style.transform = "scale(.94)";
      card.style.pointerEvents = "none";

      // Lots of rising roses.
      for (let i = 0; i < 28; i++) {
        setTimeout(createRose, i * 100);
      }

      // Extra hearts.
      for (let i = 0; i < 14; i++) {
        setTimeout(() => createRose(true), i * 170);
      }
    });

    function createRose(heart = false) {
      const rose = document.createElement("div");
      rose.className = "rose";
      rose.textContent = heart ? (Math.random() > .5 ? "💗" : "💕") : (Math.random() > .45 ? "🌹" : "🌷");
      rose.style.left = Math.random() * 100 + "vw";
      rose.style.setProperty("--drift", (Math.random() * 220 - 110) + "px");
      rose.style.animationDuration = (4.5 + Math.random() * 3.5) + "s";
      rose.style.fontSize = (24 + Math.random() * 28) + "px";
      document.body.appendChild(rose);
      setTimeout(() => rose.remove(), 9000);
    }

    restart.addEventListener("click", () => {
      location.reload();
    });
  </script>
</body>
</html>
